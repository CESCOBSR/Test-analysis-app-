<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>시험분석 매뉴얼 검색</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5B4D">
<style>
  :root{
    --brand:#0F5B4D;
    --brand-light:#E6F2EF;
    --brand-dark:#0A3F35;
    --accent:#D97706;
    --bg:#F7F6F2;
    --surface:#FFFFFF;
    --border:#E4E1D8;
    --text:#1F2420;
    --text-mute:#6B6F68;
    --text-faint:#9A9C95;
    --danger:#B3261E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Malgun Gothic',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    padding-bottom:24px;
  }
  header{
    background:var(--brand);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  header .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  header h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.2px;
  }
  header .badge{
    font-size:11px;
    background:rgba(255,255,255,0.18);
    padding:3px 8px;
    border-radius:20px;
    font-weight:500;
  }
  .search-wrap{position:relative;}
  .tab-row{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:rgba(255,255,255,0.14);
    color:rgba(255,255,255,0.75);
    font-size:13.5px;
    font-weight:500;
    padding:9px 0;
    border-radius:10px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:#fff;
    color:var(--brand-dark);
  }
  .region-chips{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .region-chip{
    border:1px solid rgba(255,255,255,0.35);
    background:transparent;
    color:#fff;
    font-size:12.5px;
    padding:5px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .region-chip.active{
    background:#fff;
    color:var(--brand-dark);
    border-color:#fff;
    font-weight:600;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:12px;
    padding:0 12px;
    height:46px;
    gap:8px;
  }
  .search-box svg{flex:none; color:var(--text-mute);}
  .search-box input{
    border:none;
    outline:none;
    flex:1;
    font-size:15px;
    background:transparent;
    color:var(--text);
    min-width:0;
  }
  .search-box input::placeholder{color:var(--text-faint);}
  .clear-btn{
    border:none;background:none;padding:4px;cursor:pointer;
    color:var(--text-faint);display:none;
  }
  .clear-btn.show{display:flex;}
  .suggest-list{
    position:absolute;
    left:0;right:0;top:52px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.16);
    max-height:340px;
    overflow-y:auto;
    z-index:30;
    display:none;
  }
  .suggest-list.show{display:block;}
  .suggest-item{
    padding:11px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    border-bottom:1px solid #F0EFE9;
  }
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:active{background:var(--brand-light);}
  .suggest-name{font-size:14px;color:var(--text);font-weight:500;}
  .suggest-path{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .suggest-count{font-size:11px;color:var(--brand);background:var(--brand-light);padding:2px 7px;border-radius:20px;flex:none;}

  main{padding:14px 16px 40px;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
  }
  .empty-state svg{margin-bottom:12px;color:var(--border);}
  .empty-state .hint{font-size:13px; margin-top:6px; color:var(--text-faint);}
  .recent-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;}
  .recent-chip{
    font-size:12.5px;
    background:#fff;
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:20px;
    color:var(--text-mute);
    cursor:pointer;
  }

  .result-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:10px;
  }
  .result-path{font-size:12px; color:var(--text-faint); margin-bottom:2px;}
  .result-title{font-size:20px; font-weight:600; letter-spacing:-0.3px;}
  .result-meta{font-size:12px; color:var(--text-mute); text-align:right;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:9px;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .card-check{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    min-width:0;
  }
  .card-check input[type="checkbox"]{
    width:17px;
    height:17px;
    flex:none;
    accent-color:var(--brand);
  }
  .quote-hint{
    font-size:11.5px;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .select-all-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .select-all-btn{
    flex:1;
    border:1px solid var(--border);
    background:#fff;
    color:var(--brand-dark);
    font-size:12.5px;
    font-weight:500;
    padding:7px 0;
    border-radius:var(--radius);
  }
  .select-all-btn:active{background:var(--brand-light);}
  .card-item-name{font-size:14.5px; font-weight:600; color:var(--text);}
  .card-fee{font-size:15px; font-weight:600; color:var(--brand-dark); white-space:nowrap;}
  .card-sub{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    gap:10px;
  }
  .card-spec{font-size:12.5px; color:var(--text-mute); line-height:1.5;}
  .card-sample{
    font-size:12px;
    color:var(--brand);
    background:var(--brand-light);
    padding:2px 8px;
    border-radius:20px;
    white-space:nowrap;
    flex:none;
  }
  .card-sample.muted{
    color:var(--text-faint);
    background:#F0EFE9;
  }
  .card-sample.micro{
    color:var(--accent);
    background:#FDF3E7;
  }
  .card-sample.unavail{
    color:var(--danger);
    background:#FDECEA;
  }
  .card-disabled{opacity:0.55;}
  .card-check-disabled{
    width:17px; height:17px; flex:none;
    border:1.5px solid var(--border); border-radius:4px;
  }
  .card-note{
    font-size:11.5px;
    color:var(--accent);
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed var(--border);
  }
  .card-flags{display:flex; gap:6px; margin-top:6px;}
  .flag{
    font-size:10.5px;
    padding:1px 6px;
    border-radius:5px;
    font-weight:600;
  }
  .flag.designated{background:#FDECEA; color:var(--danger);}
  .flag.period{background:#F0EFE9; color:var(--text-mute); font-weight:500;}

  .summary-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--brand-dark);
    color:#fff;
    padding:12px 16px;
    border-radius:var(--radius);
    margin-top:4px;
    font-size:13px;
  }
  .summary-bar .total{font-size:17px; font-weight:700;}

  .sample-summary{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-top:9px;
  }
  .sample-title{font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;}
  .sample-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text);
    padding:3px 0;
  }
  .sample-label{color:var(--text-mute);}
  .sample-value{font-weight:600;}
  .sample-detail{
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:2px;
    margin-bottom:4px;
  }
  .buffer-toggle{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12.5px;
    color:var(--text-mute);
    margin-top:8px;
    cursor:pointer;
  }
  .buffer-toggle input{width:15px; height:15px; accent-color:var(--brand);}

  .guide-note{
    font-size:11.5px;
    color:var(--text-faint);
    text-align:center;
    margin-top:14px;
    line-height:1.6;
  }

  .lead-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:9px;
  }
  .lead-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .lead-name{font-size:15px; font-weight:600; color:var(--text);}
  .lead-badge{
    font-size:10.5px;
    font-weight:600;
    padding:2px 7px;
    border-radius:20px;
    white-space:nowrap;
    flex:none;
  }
  .lead-badge.new{background:#FDECEA; color:var(--danger);}
  .lead-badge.closed{background:#F0EFE9; color:var(--text-faint);}
  .lead-addr{font-size:12.5px; color:var(--text-mute); margin-top:4px; line-height:1.5;}
  .lead-meta{
    display:flex;
    flex-wrap:wrap;
    margin-top:8px;
    font-size:11.5px;
    color:var(--text-faint);
  }
  .lead-meta > *{
    margin-right:12px;
    margin-bottom:4px;
  }
  .lead-meta a{color:var(--brand); text-decoration:none; font-weight:500;}
  .leads-count-row{
    font-size:12.5px;
    color:var(--text-mute);
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  .load-more-btn{
    width:100%;
    padding:11px 0;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:#fff;
    color:var(--brand-dark);
    font-size:13.5px;
    font-weight:500;
    margin-top:6px;
  }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#D6D3C8; border-radius:3px;}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1 id="pageTitle">시험분석 매뉴얼 검색</h1>
    <span class="badge" id="itemCountBadge">-</span>
  </div>
  <div class="tab-row">
    <button class="tab-btn active" data-tab="manual">매뉴얼 검색</button>
    <button class="tab-btn" data-tab="leads">잠재고객 발굴</button>
  </div>
  <div class="search-wrap" id="manualSearchWrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="식품유형(소분류)을 검색하세요 (예: 벌꿀)" autocomplete="off">
      <button class="clear-btn" id="clearBtn" aria-label="지우기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="suggest-list" id="suggestList"></div>
  </div>
  <div class="search-wrap" id="leadsSearchWrap" style="display:none;">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="leadsSearchInput" type="text" placeholder="업체명 또는 주소로 검색" autocomplete="off">
      <button class="clear-btn" id="leadsClearBtn" aria-label="지우기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="region-chips" id="regionChips">
      <button class="region-chip active" data-region="all">전체</button>
      <button class="region-chip" data-region="부산">부산</button>
      <button class="region-chip" data-region="울산">울산</button>
      <button class="region-chip" data-region="경남">경남</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="empty-state" id="emptyState">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <div>식품유형을 검색하면 시험검사 항목, 수수료, 시료량이 표시됩니다</div>
    <div class="hint">자가품질검사 · 냉동식품등 · 접객업소 통합 데이터</div>
    <div class="recent-row" id="popularRow"></div>
  </div>
  <div id="resultArea" style="display:none;"></div>
  <div id="leadsArea" style="display:none;"></div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
