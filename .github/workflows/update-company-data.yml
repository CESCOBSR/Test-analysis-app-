name: Update company data

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch company data
        env:
          FOOD_API_SERVICE_KEY: ${{ secrets.FOOD_API_SERVICE_KEY }}
        run: python fetch_companies.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add company-data.json
          git diff --quiet --cached || git commit -m "Update company-data.json"
          git push
